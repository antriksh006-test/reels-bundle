<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - PromptForge</title>
  <meta name="description" content="Get in touch with the PromptForge editorial team for prompt submissions, partnership inquiries, and support.">
  <link rel="canonical" href="https://promptforge.dev/contact.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="/" class="brand-logo">
        <img src="/assets/images/logo-icon.svg" alt="PromptForge" style="width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);">
        <span>PromptForge<span class="brand-badge">PRO</span></span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/prompts.html" class="nav-link">Explore Prompts</a></li>
          <li><a href="/categories.html" class="nav-link">Categories</a></li>
          <li><a href="/about.html" class="nav-link">About</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="btn-icon theme-toggle" title="Toggle theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 650px; padding: 4rem 1.5rem;">
    <div class="section-badge">Get In Touch</div>
    <h1 class="section-title" style="font-size: 2.5rem; margin-bottom: 0.75rem;">Contact Our Team</h1>
    <p class="section-desc" style="margin-bottom: 2rem;">Have a question, feedback, or a battle-tested prompt you'd like to feature? Send us a message.</p>

    <div style="background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-lg); padding: 2rem; box-shadow: var(--shadow-md);">
      <form id="contact-form" onsubmit="event.preventDefault(); window.showToast('Message sent successfully! We will get back to you shortly.'); this.reset();">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" placeholder="Your name" required>
        </div>
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="name@company.com" required>
        </div>
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label">Subject</label>
          <input type="text" class="form-input" placeholder="Prompt suggestion / partnership inquiry" required>
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Message</label>
          <textarea class="form-textarea" placeholder="How can we help?" style="min-height: 120px;" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>&copy; 2026 PromptForge. All rights reserved.</span>
      <div style="display: flex; gap: 1rem;"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/sitemap.xml">Sitemap</a></div>
    </div>
  </footer>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
