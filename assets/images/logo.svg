<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Stem & Loop Gradient (Electric Cyan to Violet) -->
    <linearGradient id="logoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Loop Accent Gradient (Violet to Neon Pink) -->
    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="logoSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Forge Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Icon Mark (44x44) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#logoBgGrad)" stroke="rgba(99, 102, 241, 0.45)" stroke-width="1.2" />
    <circle cx="26" cy="18" r="14" fill="rgba(99, 102, 241, 0.15)" filter="blur(5px)" />
    
    <!-- P Stem -->
    <rect x="10" y="9" width="6" height="26" rx="3" fill="url(#logoPrimaryGrad)" />
    <!-- P Loop -->
    <path d="M14 9H24C29.5 9 34 13.5 34 19C34 24.5 29.5 29 24 29H14V23H24C26.2 23 28 21.2 28 19C28 16.8 26.2 15 24 15H14V9Z" fill="url(#logoAccentGrad)" />
    <!-- AI Spark -->
    <path d="M33 8C33 10.5 34.8 12.3 37.3 12.3C34.8 12.3 33 14.1 33 16.6C33 14.1 31.2 12.3 28.7 12.3C31.2 12.3 33 10.5 33 8Z" fill="url(#logoSparkGrad)" filter="url(#logoGlow)" />
  </g>

  <!-- Right: Typography -->
  <text x="60" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Prompt<tspan fill="url(#textGrad)">Forge</tspan>
  </text>

  <!-- Small AI Spark above typography -->
  <path d="M226 15C226 17 227.5 18.5 229.5 18.5C227.5 18.5 226 20 226 22C226 20 224.5 18.5 222.5 18.5C224.5 18.5 226 17 226 15Z" fill="#38BDF8" opacity="0.9" />
</svg>
