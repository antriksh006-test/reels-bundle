<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Stem & Loop Gradient (Electric Cyan to Violet) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Loop Accent Gradient (Violet to Neon Pink) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Spark Gold/Cyan Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.45)" stroke-width="1.5" />

  <!-- Subtle Inner Ambient Glow -->
  <circle cx="36" cy="24" r="18" fill="rgba(99, 102, 241, 0.18)" filter="blur(6px)" />

  <!-- The "P" Monogram -->
  <!-- Vertical Stem -->
  <rect x="15" y="14" width="8" height="36" rx="4" fill="url(#primaryGrad)" />

  <!-- Upper Loop -->
  <path d="M21 14H35C42.1797 14 48 19.8203 48 27C48 34.1797 42.1797 40 35 40H21V32H35C37.7614 32 40 29.7614 40 27C40 24.2386 37.7614 22 35 22H21V14Z" fill="url(#accentGrad)" />

  <!-- AI 4-Point Spark in Upper Right -->
  <path d="M47 13C47 16.5 49.5 19 53 19C49.5 19 47 21.5 47 25C47 21.5 44.5 19 41 19C44.5 19 47 16.5 47 13Z" fill="url(#sparkGrad)" filter="url(#neonGlow)" />
</svg>
